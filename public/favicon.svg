<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Teal to Emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#02C39A" />
    </linearGradient>

    <!-- Flame Gradient: Amber Gold to Orange -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="50%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>

    <!-- Shadow filter for icon depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F2854" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- The Golden Atomic Flame -->
  <g filter="url(#dropShadow)" transform="translate(14, 12)">
    <!-- Outer Flame Body -->
    <path
      d="M18 1C18 1 21.5 5.5 21.5 10C21.5 12.8 19.8 15.2 18 17C16.2 15.2 14.5 12.8 14.5 10C14.5 5.5 18 1 18 1Z"
      fill="url(#flameGrad)"
      opacity="0.9"
    />
    <path
      d="M18 2C18 2 27 12 27 23C27 29.6 23 35 18 35C13 35 9 29.6 9 23C9 14.5 16 9.5 18 2Z"
      fill="url(#flameGrad)"
    />
    
    <!-- Inner Radiant Core -->
    <path
      d="M18 16C18 16 22 21 22 26C22 29.3 20.2 32 18 32C15.8 32 14 29.3 14 26C14 22 17 19.5 18 16Z"
      fill="url(#coreGrad)"
    />
  </g>

  <!-- Glowing Radar Dot (Top Right) -->
  <circle cx="50" cy="14" r="5" fill="#00A896" stroke="#0F2854" stroke-width="2" />
  <circle cx="50" cy="14" r="2.5" fill="#FFFFFF" />
</svg>
